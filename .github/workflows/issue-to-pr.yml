name: Create PR from New Location Issue

on:
  issues:
    types: [opened, edited, labeled]

jobs:
  create-pr:
    if: contains(github.event.issue.labels.*.name, 'new-location')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse issue and create PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const issueBody = context.payload.issue.body;
            const issueNumber = context.payload.issue.number;

            // Parse form fields from issue body
            function parseField(body, fieldName) {
              const regex = new RegExp(`### ${fieldName}\\s*\\n\\s*([^#]+?)(?=\\n###|$)`, 's');
              const match = body.match(regex);
              return match ? match[1].trim() : '';
            }

            const city = parseField(issueBody, 'City');
            const name = parseField(issueBody, 'Location Name');
            const address = parseField(issueBody, 'Address');
            const googleMapsLink = parseField(issueBody, 'Google Maps Link');
            let notes = parseField(issueBody, 'Notes') || '';
            if (notes === '_No response_') notes = '';

            async function comment(body) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
            }

            // Validate required fields
            const missingFields = [];
            if (!city) missingFields.push('City');
            if (!name) missingFields.push('Location Name');
            if (!address) missingFields.push('Address');
            if (!googleMapsLink) missingFields.push('Google Maps Link');

            if (missingFields.length > 0) {
              await comment(`❌ Missing required fields: ${missingFields.join(', ')}\n\nPlease edit the issue to include all required information.`);
              return;
            }

            const scriptsDir = path.join(process.env.GITHUB_WORKSPACE, 'scripts');
            const { cityToSlug, slugify, buildLocationFile, loadLocations, VALID_CITIES } = require(path.join(scriptsDir, 'locations'));
            const { updateReadme } = require(path.join(scriptsDir, 'generate-readme'));

            // Validate city
            const citySlug = cityToSlug(city);
            if (!citySlug) {
              await comment(`❌ Invalid city: "${city}"\n\nValid cities are: ${VALID_CITIES.join(', ')}`);
              return;
            }

            // Write the new location file
            const fileSlug = slugify(name);
            if (!fileSlug) {
              await comment(`❌ Could not build a filename from the location name "${name}". Please use a name with letters or numbers.`);
              return;
            }

            const locationPath = `data/locations/${citySlug}/${fileSlug}.md`;
            if (fs.existsSync(locationPath)) {
              await comment(`❌ A location file already exists for this name: \`${locationPath}\`\n\nIf this is a different location, please adjust the name to distinguish it.`);
              return;
            }

            fs.mkdirSync(path.dirname(locationPath), { recursive: true });
            fs.writeFileSync(locationPath, buildLocationFile({ name, address, google_maps_link: googleMapsLink, notes }), 'utf8');

            // Regenerate the README locations table from all location files
            fs.writeFileSync('README.md', updateReadme(fs.readFileSync('README.md', 'utf8'), loadLocations()), 'utf8');

            // Commit to a branch and push
            const sanitizedName = fileSlug.substring(0, 30);
            const branchName = `add-location/${issueNumber}-${sanitizedName}`;

            await exec.exec('git', ['config', 'user.name', 'github-actions[bot]']);
            await exec.exec('git', ['config', 'user.email', 'github-actions[bot]@users.noreply.github.com']);
            await exec.exec('git', ['checkout', '-b', branchName]);
            await exec.exec('git', ['add', locationPath, 'README.md']);
            await exec.exec('git', ['commit', '-m', `Add location: ${name} (${city})`]);
            await exec.exec('git', ['push', '--force', 'origin', branchName]);

            // Create PR unless one already exists for this branch (issue edits re-run this job)
            const { data: existing } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branchName}`,
              state: 'open'
            });

            if (existing.length > 0) {
              await comment(`✅ Updated PR #${existing[0].number} with the latest details from this issue.`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Add location: ${name} (${city})`,
              head: branchName,
              base: 'main',
              body: `## New Location Submission\n\n- **Name:** ${name}\n- **City:** ${city}\n- **Address:** ${address}\n- **Google Maps:** ${googleMapsLink}\n- **Notes:** ${notes || 'N/A'}\n\nAdds \`${locationPath}\`\n\nCloses #${issueNumber}`
            });

            await comment(`✅ Created PR #${pr.number} to add this location.\n\nOnce reviewed and merged, this issue will be automatically closed.`);
